<style>
/* Layout: full-bleed WebGL room; quiet brass-and-navy chrome pinned to corners; a reading card slides up from the bottom. Single committed look (the room is the room), so no theme switch. */
:root{
  --navy:#222c3b; --navy-2:#2e3a4d; --cream:#f1ebdf; --ink:#1b2230;
  --brass:#b8914a; --muted:#7c8597;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#141922;color:var(--cream);overflow:hidden}
body{font-family:var(--body);font-size:15px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.chrome{position:fixed;z-index:5;pointer-events:none}
.chrome > *{pointer-events:auto}
#nameplate{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:2px}
#nameplate h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;
  text-shadow:0 1px 12px rgba(0,0,0,.45)}
#nameplate p{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d8cfbd;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tod{align-self:flex-start;margin-top:6px;background:rgba(20,25,34,.55);color:#e9e1cf;border:1px solid rgba(232,201,138,.35);border-radius:999px;
  padding:3px 10px;font-size:11px;letter-spacing:.04em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;white-space:nowrap}
.tod:hover{border-color:rgba(232,201,138,.7)}
.tod b{font-weight:600;color:#e8c98a}
#tools{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.pill{background:rgba(20,25,34,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--cream);
  border:1px solid rgba(184,145,74,.55);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.pill:hover{border-color:var(--brass);background:rgba(34,44,59,.85)}
.pill:focus-visible,.card a:focus-visible,#menu button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#hint{bottom:calc(62px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  font-size:13px;color:#e6dece;background:rgba(20,25,34,.55);padding:7px 14px;border-radius:999px;white-space:nowrap;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .4s}
#views{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100vw - 32px);overflow-x:auto}
#views .pill{white-space:nowrap}
@media (max-aspect-ratio:4/5){ #views{gap:5px} #views .pill{padding:6px 9px;font-size:12px} }
#musicBtn[aria-pressed="true"],#views .pill[aria-pressed="true"]{background:var(--brass);color:#1b2230;border-color:var(--brass)}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--cream);color:var(--ink);font-size:12px;font-weight:600;
  padding:5px 9px;border-radius:4px;transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
.card{position:fixed;z-index:7;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(560px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s;
  background:var(--cream);color:var(--ink);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.45);
  max-height:46vh;overflow:hidden;display:flex;flex-direction:column;border-top:5px solid var(--accent,#222c3b);-webkit-backface-visibility:hidden}
.card.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.card .in{padding:18px 22px 20px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateZ(0)}
.card .in>*{flex:0 0 auto}
.card img{width:100%;max-height:220px;object-fit:cover;object-position:50% 22%;border-radius:3px;display:block}
.card .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5d6678;font-weight:600}
.card h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.card .role{font-weight:600;font-size:14px;margin:0}
.card p{margin:0;line-height:1.55;max-width:62ch}
.card ul{margin:0;padding-left:18px;line-height:1.55}
.card .links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.card a{color:#24406b;font-weight:600}
.card .email{font-family:ui-monospace,Menlo,monospace;background:#e6dece;padding:2px 6px;border-radius:3px;user-select:all}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.card .row small{color:#6b7385}
.card .close{background:var(--navy);color:var(--cream);border:0;border-radius:999px;padding:7px 14px;font-size:13px}
#menu{position:fixed;z-index:8;top:calc(58px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));
  background:rgba(20,25,34,.92);border:1px solid rgba(184,145,74,.45);border-radius:6px;padding:8px;display:flex;flex-direction:column;
  min-width:220px;max-height:70vh;overflow:auto}
#menu h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a99c80;margin:8px 8px 4px;font-weight:600}
#menu button{background:none;border:0;color:var(--cream);text-align:left;padding:7px 8px;border-radius:4px;font-size:14px}
#menu button:hover{background:rgba(184,145,74,.18)}
#menu button span{color:#a99c80;font-size:12px;margin-left:6px}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));text-align:center}
@media (max-width:520px){ #nameplate h1{font-size:22px} #hint{font-size:12px;white-space:normal;text-align:center;width:calc(100% - 48px)} .card h2{font-size:26px} }
@media (prefers-reduced-motion:reduce){ .card,#hint{transition:none} }
/* hotspot markers: quiet hollow rings that announce themselves only when the room is still */
#hots{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.95;transition:opacity .6s ease}
#hots.quiet{opacity:.62} #hots.moving{opacity:0;transition-duration:.15s}
.hot{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;transition:opacity .3s;-webkit-tap-highlight-color:transparent}
.hot::before{content:"";position:absolute;inset:15px;border-radius:50%;border:1.75px solid rgba(255,247,230,.97);background:rgba(18,22,30,.22);
  box-shadow:0 0 0 1px rgba(0,0,0,.28),0 0 6px rgba(0,0,0,.45);transition:transform .2s ease,background .2s ease,border-color .2s}
.hot::after{content:"";position:absolute;inset:15px;border-radius:50%;border:1.5px solid rgba(255,247,230,.9);opacity:0}
.hot.ping::after{animation:hotping 1.6s ease-out 1}
@keyframes hotping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.hot:hover::before,.hot:focus-visible::before,.hot.show::before{background:var(--brass);border-color:#fff7e6;transform:scale(1.2)}
.hot.off{opacity:0;pointer-events:none}
#hots.moving .hot,#hots.hidden .hot{pointer-events:none}
.hot .lbl{position:absolute;left:50%;top:6px;transform:translate(-50%,-100%);background:var(--cream);color:var(--ink);font:600 12px var(--body);padding:4px 8px;border-radius:4px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.hot:hover .lbl,.hot:focus-visible .lbl,.hot.show .lbl{opacity:1}
.hot:focus-visible{outline:none}
#hots.hidden{opacity:0}
.card .nav{display:flex;gap:8px;align-items:center}
.card .nav button{background:none;border:1px solid #c9bfa8;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.card .nav button:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){ .hot.ping::after{animation:none} #hots{transition:none} }


/* camera finish: soft lens vignette + fine film grain over the 3D view (below the UI) */
#film{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 46%, rgba(0,0,0,0) 58%, rgba(8,6,4,.34) 100%)}
#film::after{content:"";position:absolute;inset:-50%;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){ #film::after{animation:none} }
</style>

</head>

</style>

<script>
(() => {
/* ------------------------------------------------------------------ content (from lisavich.com and Mike) */
const CONTENT = {
  rekindle:{ group:"Career", label:"Rekindle book", accent:"#d9622b", year:"→ 2015",
    eyebrow:"Chapter 1 of 4 · The founder years", title:"Rekindle", role:"Co-founder",
    body:"<p>Built a mobile app that connected people through common friends. An eight-person team with a real runway, which is where the scrappiness comes from. Acquired by HubSpot in 2015.</p>"},
  tapjoy:{ group:"Career", label:"Tapjoy book", accent:"#3f8f5a", year:"Mobile ads",
    eyebrow:"Chapter 2 of 4 · The scale years", title:"Tapjoy", role:"Led global product and data science",
    body:"<p>Led the global product and data science organizations at Tapjoy, a mobile ad network. Shipped ML-driven bidding, playable ads and reporting APIs.</p>"},
  cargurus:{ group:"Career", label:"CarGurus book", accent:"#2d6fb5", year:"Marketplace",
    eyebrow:"Chapter 3 of 4 · The marketplace years", title:"CarGurus", role:"Director of Product, U.S. Dealer Products",
    body:"<p>Led the U.S. dealer product org and conceived its dealer data products, including the Dollars to Next Best Deal rating. Earlier, drove the React Native redesign of the consumer app, which became the top automotive app in the App Store.</p>"},
  klaviyo:{ group:"Career", label:"Klaviyo book", accent:"#232426", year:"Now",
    eyebrow:"Chapter 4 of 4 · The current chapter", title:"Klaviyo", role:"Senior Director of Product",
    body:"<ul><li><b>Core Marketing Products</b>, the marketing engine behind hundreds of thousands of brands.</li><li><b>Composer</b>, Klaviyo's AI product.</li><li><b>Enterprise</b> brands and businesses.</li></ul>"},
  tabor:{ group:"Shelves", label:"Tabor Academy seal", accent:"#1f3a63", year:"Marion, MA",
    eyebrow:"Where it started", title:"Tabor Academy", role:"Academic scholarship",
    body:"<p>Attended Tabor Academy, the school by the sea in Marion, Massachusetts, on an academic scholarship. The framed seal sits on the bottom shelf, next to the decanter.</p>"},
  villanova:{ group:"Shelves", label:"Villanova glove", accent:"#13294b", year:"Villanova",
    eyebrow:"Engineer by training", title:"Villanova", role:"Mechanical engineering · Baseball",
    body:"<p>Studied mechanical engineering and walked on to pitch for the Villanova baseball team. The glove and the Big East balls on this shelf are from those years.</p>"},
  osu:{ group:"Shelves", label:"Ohio State pennant", accent:"#a3112f", year:"Fisher MBA",
    eyebrow:"Business school", title:"Ohio State, Fisher College", role:"MBA, strategy and new business creation",
    body:"<p>MBA in strategy and new business creation at Fisher College of Business, where I started a venture fund inside the university.</p>"},
  cgopen:{ img:"assets/photos/cg-open.jpg", group:"Shelves", label:"CG Open pin flag", accent:"#c2272d", year:"$75K+",
    eyebrow:"Off the course, on the course", title:"The CG Open", role:"Founder",
    body:"<p>Founded the CG Open golf event at CarGurus, which has raised more than $75,000 for First Tee Massachusetts.</p>"},
  principles:{ group:"Shelves", label:"Operating principles", accent:"#5b4a2e", year:"Principles",
    eyebrow:"How I think about building", title:"Operating principles", role:"",
    body:"<ul><li><b>Delight, don't just satisfy.</b> A minimum lovable product earns an emotional reaction, even as a prototype.</li><li><b>Tight feedback loops.</b> Solve problems in partnership with customers.</li><li><b>Scrappy beats polished.</b> Real constraints create urgency. Don't confuse motion with progress.</li><li><b>Tech finds the audience, craft closes.</b> ML can find the right people; the product still has to close.</li></ul>"},
  offclock:{ group:"Shelves", label:"The Quin House book", accent:"#3b4a3a", year:"Boston",
    eyebrow:"Off the clock", title:"Home base: Boston", role:"",
    body:"<ul><li>Current obsession: chasing pars, sunsets optional.</li><li>Best night out: friends crowded around a craps table.</li><li>Once upon a time: pitched for Villanova.</li></ul>"},
  couple:{ group:"Shelves", label:"Photo of Alex and me", accent:"#5b6f86", year:"Us",
    eyebrow:"Off the clock", title:"Alex and me", role:"",
    img:"assets/photos/beach.jpg", body:"<p>My wife, Alex, and me.</p>"},
  family:{ group:"Shelves", label:"Family photo", accent:"#6b7f5a", year:"Home", img:"assets/photos/family.jpg",
    eyebrow:"Off the clock", title:"The family", role:"",
    body:"<p>The reason for everything else on these shelves.</p>"},
  rutland:{ group:"Hall", label:"Rutland", accent:"#8a6a3c", year:"Good boy", img:"assets/photos/rutland.jpg", imgPos:"50% 58%", focus:"rutland",
    eyebrow:"Just outside the doors", title:"Rutland", role:"Senior black lab · head of office security",
    body:"<p>He doesn't need to come in. He waits right outside the French doors until the last call ends.</p>"},
  oncamera:{ group:"Walls", label:"The prints behind me on calls", accent:"#8f7440", year:"On camera", focus:"webcam",
    eyebrow:"If we've been on a call", title:"The wall behind me", role:"Golf caricatures by Norman Orr",
    body:"<p>This is the view from my webcam. If we've met on a video call, you've seen these six prints behind me. They were a gift from my wife, Alex.</p><ul><li>Disgusted Caddie</li><li>Missed Putt</li><li>A Bad Lie</li><li>Hole in One</li><li>Fresh Air Shot</li><li>In the Rough</li></ul>"},
  speaking:{ img:"assets/photos/klaviyo-panel.jpg", group:"Desk", label:"Monitor", accent:"#2a3e5c", year:"On stage",
    eyebrow:"Speaking", title:"Talks", role:"",
    body:"<p>Klaviyo's K:LDN conference, and Shoptalk on what's next for the industry.</p>"},
  contact:{ img:"assets/photos/headshot.jpg", group:"Desk", label:"Laptop", accent:"#222c3b", year:"Say hello",
    eyebrow:"Get in touch", title:"Let's build something", role:"",
    body:'<p>Available for interesting conversations.</p><p><span class="email">mike@lisavich.com</span></p><div class="links"><a href="https://www.linkedin.com/in/mike-lisavich-240a27a" target="_blank" rel="noopener">LinkedIn</a><a href="https://x.com/mikelisavich" target="_blank" rel="noopener">X</a><a href="https://www.instagram.com/mikelisavich/" target="_blank" rel="noopener">Instagram</a></div>'}
};

/* ------------------------------------------------------------------ renderer */
const stage=document.getElementById('stage'), ldMsg=document.getElementById('ldMsg'), ldBar=document.getElementById('ldBar');
let renderer;
try { renderer=new THREE.WebGLRenderer({antialias:true}); } catch(e){ document.getElementById('fallback').hidden=false; document.getElementById('loading').classList.add('done'); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const MAXANISO=Math.min(16,renderer.capabilities.getMaxAnisotropy());   // keeps rug, floor, wallpaper and leather crisp at grazing angles
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#141922');
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(62,1,0.03,40);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.enablePan=true; controls.screenSpacePanning=true; controls.panSpeed=0.6; controls.rotateSpeed=0.6; controls.zoomSpeed=0.7;

/* Room in viewer space (glTF is Y-up): 10' wide (x), 12' deep (z, doors at +z), 8' tall. */
const W=3.048, D=3.658, H=2.438, X0=-W/2, X1=W/2, ZB=-D/2, ZF=D/2;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const HOME={pos:V(0.15,1.62,1.74), target:V(-0.2,1.2,-0.4)};
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);
function roomLimits(on){
  if(on){ controls.minDistance=0.35; controls.maxDistance=2.6; controls.minPolarAngle=0.85; controls.maxPolarAngle=2.05; }
  else { controls.minDistance=0; controls.maxDistance=Infinity; controls.minPolarAngle=0; controls.maxPolarAngle=Math.PI; }
}
roomLimits(true);

/* ------------------------------------------------------------------ the Frame TV: Mike's golf photos in art mode, chapters when something is opened */
const tvCanvas=document.createElement('canvas'); tvCanvas.width=1600; tvCanvas.height=896;
const tvTex=new THREE.CanvasTexture(tvCanvas); tvTex.encoding=THREE.sRGBEncoding; tvTex.flipY=false; tvTex.anisotropy=8;
const ART=['painting','golf-sunset','pebble-beach','tree-monsters','spyglass'].map(n=>{ const i=new Image();
  i.onload=()=>{ if(!tvKey && ART[artIdx%ART.length]===i) drawTV(null); }; i.src=`assets/photos/${n}.jpg`; return i; });
let artIdx=0, tvKey=null;
function coverDraw(g,im,x,y,w,h){ const s=Math.max(w/im.naturalWidth,h/im.naturalHeight), sw=w/s, sh=h/s; g.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,x,y,w,h); }
/* ------------------------------------------------------------------ TV slides: one art-directed frame per chapter, in each brand's own world.
   Drawn on canvas so they stay crisp on the Frame TV. Logos are the companies' own marks, used to identify where Mike worked. */
const SERIF='"Instrument Serif", Georgia, serif', SANS='Figtree, ui-sans-serif, system-ui, sans-serif';
const IM={};

  if(k&&CONTENT[k]){ tip.textContent=CONTENT[k].label; tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; tip.classList.add('on'); } else tip.classList.remove('on');
});
let down=null; renderer.domElement.addEventListener('pointerdown',ev=>{ down={x:ev.clientX,y:ev.clientY}; });
renderer.domElement.addEventListener('pointerup',ev=>{ if(!down) return; const moved=Math.hypot(ev.clientX-down.x,ev.clientY-down.y); down=null; if(moved>6) return;
  const k=pick(ev); if(k&&CONTENT[k]) open(k); else if(card.classList.contains('on')||focus) closeAndReturn(); });

/* ------------------------------------------------------------------ hotspots: a pulsing brass dot on everything that opens */
const HOT_AT={ villanova:V(0.6,2.09,-1.64) };   // the glove; the felt shield on the front wall is still tappable directly
const hotsEl=document.getElementById('hots'), HOTS=[], CAREER=['rekindle','tapjoy','cargurus','klaviyo'];
function buildHots(){
  const items=Object.keys(keyRoots).filter(k=>CONTENT[k]&&!CAREER.includes(k)).map(k=>({key:k,label:CONTENT[k].label,glow:[k]}));
  if(keyRoots.klaviyo) items.push({key:'rekindle',anchor:'klaviyo',label:'Career · four books',glow:CAREER.filter(k=>keyRoots[k])});
  for(const it of items){
    const box=new THREE.Box3().setFromObject(keyRoots[it.anchor||it.key]), c=HOT_AT[it.key]?HOT_AT[it.key].clone():box.getCenter(new THREE.Vector3());
    if(it.anchor){ CAREER.forEach(k=>keyRoots[k]&&box.expandByObject(keyRoots[k])); c.copy(box.getCenter(new THREE.Vector3())); c.y=box.max.y+0.05; }
    const b=document.createElement('button'); b.className='hot'; b.type='button';
    b.setAttribute('aria-label','Open '+it.label); b.innerHTML=`<span class="lbl">${it.label}</span>`;
    b.addEventListener('click',e=>{ e.stopPropagation(); open(it.key); });
    b.addEventListener('pointerenter',()=>it.glow.forEach(k=>setGlow(k,true)));
    b.addEventListener('pointerleave',()=>it.glow.forEach(k=>setGlow(k,false)));
    hotsEl.appendChild(b); HOTS.push({el:b,pos:c,glow:it.glow,occ:false});
  }
}
const hv=new THREE.Vector3(), occRay=new THREE.Raycaster(); let hotFrame=0;
function occluded(ht){ const dir=ht.pos.clone().sub(camera.position), dist=dir.length(); occRay.set(camera.position,dir.normalize()); occRay.far=dist;
  const hit=occRay.intersectObjects(scene.children,true).find(x=>!x.object.material?.transparent);
  return !!hit && hit.distance<dist-0.06 && !ht.glow.includes(keyOf(hit.object)); }
function fullOcc(){ HOTS.forEach(ht=>ht.occ=occluded(ht)); }
// Rings step back while you move, return when you stop, then settle to a whisper.
let quietT=null;
function moving(){ hotsEl.classList.add('moving'); hotsEl.classList.remove('quiet'); clearTimeout(quietT); }
function settled(){ hotsEl.classList.remove('moving'); clearTimeout(quietT); quietT=setTimeout(()=>hotsEl.classList.add('quiet'),4500); }
controls.addEventListener('start',moving); controls.addEventListener('end',()=>setTimeout(settled,250));
// Every few seconds one visible ring sends out a single soft ripple, so the eye finds them without the room flashing.
setInterval(()=>{ if(reduce||hotsEl.classList.contains('moving')||hotsEl.classList.contains('hidden')) return;
  const vis=HOTS.filter(ht=>!ht.el.classList.contains('off')); if(!vis.length) return;
  const ht=vis[Math.floor(Math.random()*vis.length)]; ht.el.classList.remove('ping'); void ht.el.offsetWidth; ht.el.classList.add('ping'); },5000);
function updateHots(){
  const hide=!!flying||card.classList.contains('on')||!litDone; hotsEl.classList.toggle('hidden',hide); if(hide||!HOTS.length) return;
  const w=stage.clientWidth, h=stage.clientHeight, chk=HOTS[hotFrame++%HOTS.length];
  for(const ht of HOTS){
    hv.copy(ht.pos).project(camera);
    const x=(hv.x*.5+.5)*w, y=(-hv.y*.5+.5)*h, out=hv.z>1||x<-30||x>w+30||y<-30||y>h+30;
    if(ht===chk&&!out) ht.occ=occluded(ht);
    ht.el.classList.toggle('off',out||ht.occ);
    if(!out) ht.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  }
}
// first visit: light each thing up in turn so the room introduces itself
function introSweep(){ if(reduce) return; const keys=Object.keys(keyRoots); let i=0;
  const step=()=>{ if(i>0) setGlow(keys[i-1],false); if(i<keys.length&&!card.classList.contains('on')){ setGlow(keys[i],true); i++; setTimeout(step,160); } };
  step(); HOTS.forEach((ht,j)=>setTimeout(()=>{ ht.el.classList.remove('ping'); void ht.el.offsetWidth; ht.el.classList.add('ping'); },j*140)); settled(); }

const TVPOS=V(X1-0.04,1.50,-0.98);
const FOCI={ tv:{pos:V(-0.55,1.42,-0.98), target:V(X1,1.24,-0.98)},
             webcam:{pos:V(-0.07,1.37,0.28), target:V(X0,1.12,0.28)},
             rutland:{pos:V(0.2,1.35,0.6), target:V(0.15,0.55,1.62)} };
function fly(to,done){ moving(); flying={from:{pos:camera.position.clone(),target:controls.target.clone()},to,start:performance.now(),done}; controls.enabled=false; roomLimits(false); }
function open(key){
  if(!focus) returnTo={pos:camera.position.clone(),target:controls.target.clone()};
  const c=CONTENT[key]; drawTV(key); hint.style.opacity=0;
  card.style.setProperty('--accent',c.accent);
  cardIn.innerHTML=`${c.img?`<img src="${c.img}" alt=""${c.imgPos?` style="object-position:${c.imgPos}"`:''}>`:''}<div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2>${c.role?`<p class="role">${c.role}</p>`:''}${c.body}
    <div class="row">${c.group==='Career'?`<div class="nav"><button id="prevCh" ${CAREER.indexOf(key)===0?'disabled':''}>← Earlier</button><button id="nextCh" ${CAREER.indexOf(key)===CAREER.length-1?'disabled':''}>Later →</button></div>`:'<small>Esc or Back returns you to where you were</small>'}<button class="close" id="closeCard">Close</button></div>`;
  document.getElementById('closeCard').onclick=()=>closeAndReturn();
  if(c.group==='Career'){ const i=CAREER.indexOf(key);
    document.getElementById('prevCh').onclick=()=>i>0&&open(CAREER[i-1]); document.getElementById('nextCh').onclick=()=>i<CAREER.length-1&&open(CAREER[i+1]); }
  cardIn.scrollTop=0; card.classList.add('on'); viewsEl.hidden=true; backBtn.hidden=false;
  /* iOS Safari sometimes skips painting new content in a layer mid-transition: nudge a repaint once images settle */
  const kick=()=>{ cardIn.style.transform='translateZ(0.01px)'; requestAnimationFrame(()=>{ cardIn.style.transform=''; }); };
  cardIn.querySelectorAll('img').forEach(im=>{ if(!im.complete) im.addEventListener('load',kick,{once:true}); }); setTimeout(kick,480);
  const f=c.focus||'tv', portrait=camera.aspect<0.8, dest=(f==='tv'&&portrait)?{pos:V(-0.12,1.47,-0.98),target:V(X1,1.16,-0.98)}:FOCI[f];
  if(focus!==f){ focus=f; fly(dest); }
}
function closeCard(){ card.classList.remove('on'); viewsEl.hidden=false; }
function closeAndReturn(){ const r=returnTo||HOME; returnTo=null; closeCard(); drawTV(null); focus=null; backBtn.hidden=true; fly(r,()=>roomLimits(true)); }
backBtn.onclick=()=>closeAndReturn();
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!menu.hidden) toggleMenu(false); else if(focus||card.classList.contains('on')) closeAndReturn(); }});

const menu=document.getElementById('menu'), menuBtn=document.getElementById('menuBtn');
const groups={Career:'Book stack · career',Shelves:'Shelves',Walls:'Walls',Desk:'Desk',Hall:'Outside the doors'};
menu.innerHTML=Object.entries(groups).map(([g,t])=>`<h3>${t}</h3>`+Object.entries(CONTENT).filter(([,c])=>c.group===g)
  .map(([k,c])=>`<button data-k="${k}">${c.title}<span>${c.label}</span></button>`).join('')).join('');
menu.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; toggleMenu(false); open(b.dataset.k); });
function toggleMenu(on){ menu.hidden=!on; menuBtn.setAttribute('aria-expanded',on); }
menuBtn.onclick=()=>toggleMenu(menu.hidden);

const VIEWS={ door:{label:'Doorway',pos:HOME.pos,target:HOME.target},
  desk:{label:'Desk',pos:V(0.75,1.6,1.2),target:V(-1.2,1.2,-0.3)},
  shelves:{label:'Shelves',pos:V(-0.05,1.5,0.35),target:V(-0.05,1.42,-1.83)},
  chairs:{label:'Chairs',pos:V(-1.2,1.55,1.35),target:V(1.0,1.05,-0.6)} };
{ const narrow=innerWidth/innerHeight<0.8; delete VIEWS.shelves;
  const v=VIEWS; const o={door:v.door,desk:v.desk,
    left:{label:'Left shelf',pos:narrow?V(-1.0,1.6,-0.28):V(-0.95,1.5,0.2),target:V(-1.0,1.5,-1.83)},
    right:{label:'Right shelf',pos:narrow?V(0.89,1.6,-0.28):V(0.85,1.5,0.2),target:V(0.89,1.5,-1.83)}, chairs:v.chairs};
  Object.keys(VIEWS).forEach(k=>delete VIEWS[k]); Object.assign(VIEWS,o); }
viewsEl.innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button class="pill" data-v="${k}" aria-pressed="${k==='door'}">${v.label}</button>`).join('');
viewsEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const k=b.dataset.v;
  viewsEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===k));
  returnTo=null; closeCard(); drawTV(null); focus=null; backBtn.hidden=true; hint.style.opacity=0; fly(VIEWS[k],()=>roomLimits(true)); });

/* ------------------------------------------------------------------ music: "Back Nine", an original pastoral piece played live with Web Audio.
   Written for this room (fingerpicked arpeggios, a soft pad and a simple tune); it does not quote any existing melody. */
const Music=(()=>{
  let ac=null, master=null, verb=null, timer=null, next=0, step=0, on=false;
  const BPM=74, E=60/BPM/2;                 // eighth-note length
  const n=m=>440*Math.pow(2,(m-69)/12);
  // D  A/C#  Bm  G  D/F#  Em7  Asus4  A   (one bar each; MIDI roots)
  const CH=[[50,57,62,66,69],[49,57,61,64,69],[47,54,59,62,66],[43,50,55,59,62],[42,50,54,57,62],[40,47,52,55,62],[45,52,57,62,64],[45,52,57,61,64]];
  const ARP=[0,2,3,4,3,2,1,2];              // indexes into the chord, eight eighths per bar
  // melody: [bar, eighth, midi, length in eighths]
  const MEL=[[0,0,74,3],[0,3,76,1],[0,4,78,4],[1,0,76,3],[1,3,74,1],[1,4,73,4],[2,0,71,2],[2,2,73,2],[2,4,74,4],[3,0,71,6],[3,6,69,2],
             [4,0,69,2],[4,2,71,2],[4,4,74,4],[5,0,76,3],[5,3,74,1],[5,4,71,4],[6,0,74,4],[6,4,76,4],[7,0,73,8]];
  function impulse(){ const len=ac.sampleRate*2.6, b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4); } return b; }
  function pluck(t,f,vel,dur){ const o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
    o.type='triangle'; o2.type='sine'; o.frequency.value=f; o2.frequency.value=f*2.001; lp.type='lowpass'; lp.frequency.setValueAtTime(f*6,t); lp.frequency.exponentialRampToValueAtTime(f*1.5,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+0.006); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master); g.connect(verb); o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05); }
  function pad(t,ch,dur){ ch.slice(1,4).forEach(m=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=n(m); o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.022,t+dur*0.4); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(verb); o.start(t); o.stop(t+dur+0.1); }); }
  function schedule(){
    while(next<ac.currentTime+0.4){
      const bar=Math.floor(step/8)%8, e=step%8, ch=CH[bar], loop=Math.floor(step/64);
      pluck(next,n(ch[ARP[e]]),e===0?0.11:0.07,1.6);
      if(e===0){ pluck(next,n(ch[0]-12),0.09,2.4); pad(next,ch,E*8); }
      if(loop%2===1) MEL.filter(x=>x[0]===bar&&x[1]===e).forEach(x=>pluck(next,n(x[2]),0.12,x[3]*E*1.6));
      next+=E*(e%2?0.94:1.06); step++;           // a little swing
    } }
  return { toggle(){
    if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0; master.connect(ac.destination);
      verb=ac.createConvolver(); verb.buffer=impulse(); const vg=ac.createGain(); vg.gain.value=0.5; verb.connect(vg); vg.connect(master); }
    on=!on;
    if(on){ ac.resume(); next=ac.currentTime+0.1; master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(0.9,ac.currentTime+2.5); timer=setInterval(schedule,100); }
    else { master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(0,ac.currentTime+0.8); clearInterval(timer); }
    return on; } };
})();
const musicBtn=document.getElementById('musicBtn');
musicBtn.onclick=()=>{ let on=false; try{ on=Music.toggle(); }catch(e){ console.error(e); } musicBtn.setAttribute('aria-pressed',on); musicBtn.title=on?'Pause the music':'Play an original golf tune'; };

/* ------------------------------------------------------------------ loop */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<0.8?78:62; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tick(now){
  if(flying){ const t=reduce?1:Math.min(1,(now-flying.start)/1000), e=ease(t);
    camera.position.lerpVectors(flying.from.pos,flying.to.pos,e); controls.target.lerpVectors(flying.from.target,flying.to.target,e);
    if(t>=1){ const d=flying.done; flying=null; controls.enabled=true; if(d) d(); fullOcc(); settled(); } }
  controls.update();
  const tg=controls.target; tg.x=Math.min(X1-0.2,Math.max(X0+0.2,tg.x)); tg.z=Math.min(ZF-0.2,Math.max(ZB+0.05,tg.z)); tg.y=Math.min(H-0.2,Math.max(0.4,tg.y));
  const p=camera.position; p.x=Math.min(X1-0.12,Math.max(X0+0.12,p.x)); p.z=Math.min(ZF-0.08,Math.max(ZB+0.12,p.z)); p.y=Math.min(H-0.12,Math.max(0.45,p.y));
  stepLights(now); updateHots(); renderer.render(scene,camera); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
